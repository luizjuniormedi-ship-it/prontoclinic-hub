name: Apply reception parent patch

on:
  push:
    branches: [ux/sidebar-navigation-refactor]
    paths:
      - scripts/apply-reception-parent-patch.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/sidebar-navigation-refactor
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply targeted patch
        run: node scripts/apply-reception-parent-patch.mjs
      - name: Commit patch and remove one-shot files
        run: |
          git config user.name "ProntoMedic CI"
          git config user.email "dev@prontomedic.com.br"
          git rm scripts/apply-reception-parent-patch.mjs .github/workflows/apply-reception-parent-patch.yml
          git add src/pages/ReceptionPage.tsx src/components/reception/ReceptionFinancialPanel.tsx
          git commit -m "fix(reception): refresh checkout readiness in place"
          git push origin HEAD:ux/sidebar-navigation-refactor
