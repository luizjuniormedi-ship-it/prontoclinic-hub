name: CI

concurrency:
  group: prontomedic-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:18000
      VITE_SUPABASE_ANON_KEY: local-e2e-public-key
      TISS_XSD_PATH: vendor/tiss/040300/tissV4_03_00.xsd

    services:
      postgres:
        # Keep the disposable server aligned with the PostgreSQL client
        # shipped by ubuntu-latest so pg_dump/pg_restore rehearsals are valid.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify official TISS 04.03.00 schemas
        shell: pwsh
        run: ./scripts/verify-tiss-schemas.ps1

      - name: Validate published Edge Functions
        run: |
          docker run --rm \
            -v "$PWD:/app" -w /app \
            --entrypoint deno denoland/deno:2.5.6 \
            check \
            supabase/functions/auth-admin/index.ts \
            supabase/functions/dicom-bridge/index.ts \
            supabase/functions/telemedicina-daily/index.ts
          docker run --rm \
            -v "$PWD:/app" -w /app \
            --entrypoint deno denoland/deno:2.5.6 \
            test --allow-env supabase/functions/_shared/cors_test.ts
          bash deploy/edge-runtime/deploy-functions.test.sh
          if grep -R '"Access-Control-Allow-Origin": "\*"' \
            supabase/functions/auth-admin \
            supabase/functions/dicom-bridge \
            supabase/functions/telemedicina-daily; then
            echo "::error::CORS wildcard encontrado nas Edge Functions"
            exit 1
          fi

      - name: Validate migration versions
        run: |
          versions=''
          for migration in supabase/migrations/*.sql; do
            filename=${migration##*/}
            version=${filename%%_*}
            versions="${versions}${version}\n"
          done
          duplicates=$(printf '%b' "$versions" | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "Migration versions duplicated:"
            printf '%s\n' "$duplicates"
            exit 1
          fi

      - name: Replay clean schema and test authorization twice
        env:
          PGPASSWORD: postgres
        run: |
          for database in migrations_first migrations_second; do
            createdb -h localhost -p 54322 -U postgres "$database"
            PGHOST=localhost PGPORT=54322 PGUSER=postgres \
              scripts/replay-migrations.sh "$database"
            psql -v ON_ERROR_STOP=1 \
              -h localhost -p 54322 -U postgres -d "$database" \
              -f tests/database/auth_foundation.sql >/dev/null
            psql -v ON_ERROR_STOP=1 \
              -h localhost -p 54322 -U postgres -d "$database" \
              -f tests/database/access_context_foundation.sql >/dev/null
            psql -v ON_ERROR_STOP=1 \
              -h localhost -p 54322 -U postgres -d "$database" \
              -f tests/database/sessions_and_secure_drafts.sql >/dev/null
            psql -v ON_ERROR_STOP=1 \
              -h localhost -p 54322 -U postgres -d "$database" \
              -f tests/database/auth_admin_provisioning.sql >/dev/null
            psql -v ON_ERROR_STOP=1 \
              -h localhost -p 54322 -U postgres -d "$database" \
              -f tests/database/local_auth_admin_contract.sql >/dev/null
            psql -v ON_ERROR_STOP=1 \
              -h localhost -p 54322 -U postgres -d "$database" \
              -f tests/database/companies_units_admin_contract.sql >/dev/null
            psql -v ON_ERROR_STOP=1 \
              -h localhost -p 54322 -U postgres -d "$database" \
              -f tests/database/rbac_active_context_aal2.sql >/dev/null
            psql -v ON_ERROR_STOP=1 \
              -h localhost -p 54322 -U postgres -d "$database" \
              -f tests/database/operational_rls.sql >/dev/null
            psql -v ON_ERROR_STOP=1 \
              -h localhost -p 54322 -U postgres -d "$database" \
              -f tests/database/nps_public_security.sql >/dev/null
            psql -v ON_ERROR_STOP=1 \
              -h localhost -p 54322 -U postgres -d "$database" \
              -f tests/database/call_center_atomic_commands.sql >/dev/null
            psql -v ON_ERROR_STOP=1 \
              -h localhost -p 54322 -U postgres -d "$database" \
              -f supabase/tests/module39_billing_account_operational_closure_contract.sql >/dev/null
            psql -v ON_ERROR_STOP=1 \
              -h localhost -p 54322 -U postgres -d "$database" \
              -f supabase/tests/module8_pharmacy_runtime_contract.sql >/dev/null
            psql -v ON_ERROR_STOP=1 \
              -h localhost -p 54322 -U postgres -d "$database" \
              -f supabase/tests/module22_exam_requests_contract.sql >/dev/null
            psql -v ON_ERROR_STOP=1 \
              -h localhost -p 54322 -U postgres -d "$database" \
              -f supabase/tests/financial_appointment_future_uniqueness_contract.sql >/dev/null
            psql -v ON_ERROR_STOP=1 \
              -h localhost -p 54322 -U postgres -d "$database" \
              -f supabase/tests/module11_reception_precheck_dependency_acl_contract.sql >/dev/null
            psql -v ON_ERROR_STOP=1 \
              -h localhost -p 54322 -U postgres -d "$database" \
              -f supabase/tests/module37_billing_account_audit_contract.sql >/dev/null
            psql -v ON_ERROR_STOP=1 \
              -h localhost -p 54322 -U postgres -d "$database" \
              -f supabase/tests/patients_definitive_unit_sharing_contract.sql >/dev/null
              psql -v ON_ERROR_STOP=1 \
                -h localhost -p 54322 -U postgres -d "$database" \
                -f supabase/tests/reception_tiss_owner_contract.sql >/dev/null
              psql -v ON_ERROR_STOP=1 \
                -h localhost -p 54322 -U postgres -d "$database" \
                -f supabase/tests/module16_tiss_account_materialization_contract.sql >/dev/null
              psql -v ON_ERROR_STOP=1 \
                -h localhost -p 54322 -U postgres -d "$database" \
                -f supabase/tests/canonical_reception_billing_tiss_handoff_contract.sql >/dev/null
              psql -v ON_ERROR_STOP=1 \
                -h localhost -p 54322 -U postgres -d "$database" \
                -f supabase/tests/schedule_rpc_signature_parity.sql >/dev/null
            done

          cleanup_m23_replay() {
            dropdb --if-exists -h localhost -p 54322 -U postgres \
              prontomedic_reception_m23_ci >/dev/null 2>&1 || true
          }
          trap cleanup_m23_replay EXIT
          cleanup_m23_replay
          createdb -h localhost -p 54322 -U postgres \
            -T migrations_second prontomedic_reception_m23_ci
          psql -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres \
            -d prontomedic_reception_m23_ci \
            -f supabase/tests/module23_lis_contract.sql >/dev/null
          psql -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres \
            -d prontomedic_reception_m23_ci \
            -f supabase/tests/module23_lis_runtime_contract.sql >/dev/null
          psql -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres \
            -d prontomedic_reception_m23_ci \
            -f supabase/tests/module23_lis_authenticated_replay.sql >/dev/null
          cleanup_m23_replay
          trap - EXIT

          cleanup_m24_replay() {
            dropdb --if-exists -h localhost -p 54322 -U postgres \
              prontomedic_reception_m24_ci >/dev/null 2>&1 || true
          }
          trap cleanup_m24_replay EXIT
          cleanup_m24_replay
          createdb -h localhost -p 54322 -U postgres \
            -T migrations_second prontomedic_reception_m24_ci
          psql -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres \
            -d prontomedic_reception_m24_ci \
            -f supabase/tests/module24_imaging_ris_contract.sql >/dev/null
          psql -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres \
            -d prontomedic_reception_m24_ci \
            -f supabase/tests/module24_imaging_ris_runtime_contract.sql >/dev/null
          psql -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres \
            -d prontomedic_reception_m24_ci \
            -f supabase/rollbacks/20260817090000_m24_imaging_ris_runtime_hardening.sql >/dev/null
          psql -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres \
            -d prontomedic_reception_m24_ci \
            -f supabase/tests/module24_imaging_ris_rollback_contract.sql >/dev/null
          psql -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres \
            -d prontomedic_reception_m24_ci \
            -f supabase/migrations/20260817090000_m24_imaging_ris_runtime_hardening.sql >/dev/null
          psql -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres \
            -d prontomedic_reception_m24_ci \
            -f supabase/tests/module24_imaging_ris_contract.sql >/dev/null
          psql -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres \
            -d prontomedic_reception_m24_ci \
            -f supabase/tests/module24_imaging_ris_runtime_contract.sql >/dev/null
          bash supabase/tests/module24_imaging_ris_concurrency.sh \
            localhost 54322 postgres prontomedic_reception_m24_ci
          cleanup_m24_replay
          trap - EXIT

          # Retry das migrations críticas no mesmo banco: qualquer aplicação
          # parcial precisa convergir sem objetos duplicados.
          for migration in \
            20260716203000_auth_foundation.sql \
            20260716210000_access_context_foundation.sql \
            20260716220000_sessions_and_secure_drafts.sql \
            20260716230000_auth_admin_provisioning.sql \
            20260716240000_operational_rls_closure.sql \
            20260717000000_legacy_schema_normalization.sql \
            20260717001000_auth_admin_access_transition.sql \
            20260717002000_access_context_options.sql \
            20260804143000_rbac_active_context_aal2.sql \
            20260805123000_auth_admin_suspension_invariants.sql; do
            psql -v ON_ERROR_STOP=1 -h localhost -p 54322 -U postgres \
              -d migrations_first --single-transaction \
              -f "supabase/migrations/$migration" >/dev/null
          done

      - name: Validate transactional database deploy and rollback
        env:
          PGHOST: localhost
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PRONTOMEDIC_DATABASE: prontoclinic_dbdeploy
          PRONTOMEDIC_DB_TEST_MODE: "1"
          PRONTOMEDIC_DB_DIRECT_POSTGRES: "1"
          PRONTOMEDIC_DB_BACKUP_ROOT: /tmp/prontomedic-dbdeploy/backups
          PRONTOMEDIC_DB_STATE_ROOT: /tmp/prontomedic-dbdeploy/state
          PRONTOMEDIC_GLOBAL_DEPLOY_LOCK: /tmp/prontomedic-dbdeploy/global.lock
        run: |
          bash deploy/database/deploy-migration.integration.sh

      - name: Reject unknown legacy authorization policies during upgrade
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -p 54322 -U postgres migrations_upgrade_guard
          PGHOST=localhost PGPORT=54322 PGUSER=postgres \
            REPLAY_STOP_BEFORE=20260716203000_auth_foundation.sql \
            scripts/replay-migrations.sh migrations_upgrade_guard
          psql -v ON_ERROR_STOP=1 -h localhost -p 54322 -U postgres \
            -d migrations_upgrade_guard \
            -c 'CREATE POLICY legacy_allow_all ON public.user_profiles FOR ALL TO authenticated USING (true) WITH CHECK (true);'
          if psql -v ON_ERROR_STOP=1 -h localhost -p 54322 -U postgres \
            -d migrations_upgrade_guard --single-transaction \
            -f supabase/migrations/20260716203000_auth_foundation.sql >/dev/null 2>&1; then
            echo 'Auth foundation accepted an unknown legacy policy' >&2
            exit 1
          fi
          psql -v ON_ERROR_STOP=1 -h localhost -p 54322 -U postgres \
            -d migrations_upgrade_guard \
            -c 'DROP POLICY legacy_allow_all ON public.user_profiles;'
          psql -v ON_ERROR_STOP=1 -h localhost -p 54322 -U postgres \
            -d migrations_upgrade_guard --single-transaction \
            -f supabase/migrations/20260716203000_auth_foundation.sql >/dev/null
          test "$(psql -At -v ON_ERROR_STOP=1 -h localhost -p 54322 -U postgres \
            -d migrations_upgrade_guard -c "SELECT count(*) FROM pg_policies WHERE schemaname = 'public' AND tablename IN ('user_profiles', 'roles', 'role_permissions') AND policyname NOT IN ('user_profiles_select_authorized', 'user_profiles_insert_company_admin', 'user_profiles_update_company_admin', 'roles_select_authenticated', 'role_permissions_select_company', 'role_permissions_insert_company_admin', 'role_permissions_update_company_admin')")" = "0"
          for migration in \
            20260716210000_access_context_foundation.sql \
            20260716220000_sessions_and_secure_drafts.sql \
            20260716230000_auth_admin_provisioning.sql; do
            psql -v ON_ERROR_STOP=1 -h localhost -p 54322 -U postgres \
              -d migrations_upgrade_guard --single-transaction \
              -f "supabase/migrations/$migration" >/dev/null
          done
          psql -v ON_ERROR_STOP=1 -h localhost -p 54322 -U postgres \
            -d migrations_upgrade_guard \
            -c 'CREATE POLICY legacy_allow_all ON public.professional_schedules FOR SELECT TO authenticated USING (true);'
          if psql -v ON_ERROR_STOP=1 -h localhost -p 54322 -U postgres \
            -d migrations_upgrade_guard --single-transaction \
            -f supabase/migrations/20260716240000_operational_rls_closure.sql >/dev/null 2>&1; then
            echo 'Operational RLS closure accepted an unknown legacy policy' >&2
            exit 1
          fi
          psql -v ON_ERROR_STOP=1 -h localhost -p 54322 -U postgres \
            -d migrations_upgrade_guard \
            -c 'DROP POLICY legacy_allow_all ON public.professional_schedules;'
          psql -v ON_ERROR_STOP=1 -h localhost -p 54322 -U postgres \
            -d migrations_upgrade_guard --single-transaction \
            -f supabase/migrations/20260716240000_operational_rls_closure.sql >/dev/null

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 30

      - name: Prepare deterministic local E2E backend
        env:
          PGPASSWORD: postgres
        run: |
          E2E_PASSWORD=$(openssl rand -hex 24)
          E2E_MFA_SECRET=$(openssl rand -base64 32 | tr -dc 'A-Z2-7' | head -c 32)
          AUTH_MFA_ENCRYPTION_KEY=$(openssl rand -hex 32)
          export E2E_PASSWORD
          export E2E_MFA_SECRET
          export AUTH_MFA_ENCRYPTION_KEY
          echo "::add-mask::$E2E_PASSWORD"
          echo "::add-mask::$E2E_MFA_SECRET"
          echo "::add-mask::$AUTH_MFA_ENCRYPTION_KEY"
          echo "E2E_PASSWORD=$E2E_PASSWORD" >> "$GITHUB_ENV"
          echo "E2E_MFA_SECRET=$E2E_MFA_SECRET" >> "$GITHUB_ENV"
          echo "AUTH_MFA_ENCRYPTION_KEY=$AUTH_MFA_ENCRYPTION_KEY" >> "$GITHUB_ENV"
          psql -X -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres -d migrations_second \
            -f scripts/seed-e2e-users.sql >/dev/null
          echo "LOCAL_E2E_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Start deterministic local E2E backend
        env:
          PGHOST: localhost
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          # migrations_first is intentionally mutated by the historical
          # idempotency retries above. The E2E gate must exercise the clean,
          # canonical result of a complete chronological replay.
          PGDATABASE: migrations_second
          JWT_SECRET: ${{ env.LOCAL_E2E_JWT_SECRET }}
          LOCAL_AUTH_MODE: test
          LOCAL_AUTH_PORT: 18000
          CORS_ALLOWED_ORIGINS: http://localhost:4173
          AUTH_MFA_ENCRYPTION_KEY: ${{ env.AUTH_MFA_ENCRYPTION_KEY }}
        run: |
          node local-auth-server.mjs >/tmp/local-e2e-backend.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18000/auth/v1/settings >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/local-e2e-backend.log
          exit 1

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run authentication and MFA AAL2 E2E gate
        run: npx playwright test e2e/auth.spec.ts --project=chromium --workers=1
        env:
          CI: true
          E2E_BASE_URL: http://localhost:4173
          VITE_SUPABASE_URL: http://127.0.0.1:18000
          VITE_SUPABASE_ANON_KEY: local-e2e-public-key
          PGHOST: localhost
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: migrations_second

      - name: Run dedicated reception E2E gate
        run: npx playwright test e2e/recepcao.spec.ts --project=chromium --workers=1
        env:
          CI: true
          E2E_BASE_URL: http://localhost:4173
          VITE_SUPABASE_URL: http://127.0.0.1:18000
          VITE_SUPABASE_ANON_KEY: local-e2e-public-key
          PGHOST: localhost
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: migrations_second

      - name: Run dedicated pharmacy E2E gate
        run: npx playwright test e2e/pharmacy.spec.ts --project=chromium --workers=1
        env:
          CI: true
          E2E_BASE_URL: http://localhost:4173
          VITE_SUPABASE_URL: http://127.0.0.1:18000
          VITE_SUPABASE_ANON_KEY: local-e2e-public-key
          PGHOST: localhost
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: migrations_second

      - name: Restore deterministic E2E fixtures
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres -d migrations_second \
            -f scripts/seed-e2e-users.sql >/dev/null

      - name: Run dedicated scheduling E2E gate
        run: npx playwright test e2e/agendamento.spec.ts --project=chromium --workers=1
        env:
          CI: true
          E2E_BASE_URL: http://localhost:4173
          VITE_SUPABASE_URL: http://127.0.0.1:18000
          VITE_SUPABASE_ANON_KEY: local-e2e-public-key
          PGHOST: localhost
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: migrations_second

      - name: Restore deterministic E2E fixtures after scheduling
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres -d migrations_second \
            -f scripts/seed-e2e-users.sql >/dev/null

      - name: Run canonical phase 0/1 E2E gate
        run: npx playwright test e2e/gate-phase01.spec.ts --project=chromium --workers=1
        env:
          CI: true
          E2E_BASE_URL: http://localhost:4173
          VITE_SUPABASE_URL: http://127.0.0.1:18000
          VITE_SUPABASE_ANON_KEY: local-e2e-public-key
          PGHOST: localhost
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: migrations_second

      - name: Restore deterministic E2E fixtures before companies
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres -d migrations_second \
            -f scripts/seed-e2e-users.sql >/dev/null

      - name: Run dedicated companies and units E2E gate
        run: npx playwright test e2e/companies.spec.ts --project=chromium --workers=1
        env:
          CI: true
          E2E_ENV: local
          E2E_MODE: mutating
          E2E_ALLOW_LOCAL_MUTATIONS: true
          E2E_BASE_URL: http://localhost:4173
          VITE_SUPABASE_URL: http://127.0.0.1:18000
          VITE_SUPABASE_ANON_KEY: local-e2e-public-key
          PGHOST: localhost
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: migrations_second

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-junit
          path: test-results/junit.xml
          retention-days: 30

      - name: Upload JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/results.json
          retention-days: 30
