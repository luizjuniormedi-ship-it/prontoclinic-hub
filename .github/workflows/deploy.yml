name: Deploy ProntoClinic Hub to Vercel

# Deploy automatico para Vercel em cada push em main.
# Secrets necessarios (Settings > Secrets and variables > Actions):
#   - VERCEL_TOKEN        (https://vercel.com/account/tokens)
#   - VERCEL_ORG_ID       (times/_/settings)
#   - VERCEL_PROJECT_ID   (project settings > General)
#   - VITE_SUPABASE_URL
#   - VITE_SUPABASE_ANON_KEY
#
# Variaveis Vercel (Settings > Environment Variables no dashboard Vercel):
#   VITE_APP_NAME, VITE_APP_ENV, VITE_TISS_AMBIENTE, VITE_TISS_VERSION,
#   VITE_DICOM_BUCKET, VITE_ENABLE_TELEMEDICINE, VITE_ENABLE_WHATSAPP,
#   VITE_RESEND_API_KEY (opcional).

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full commit SHA already integrated into main"
        required: true
      environment:
        description: "Vercel environment (production | preview)"
        required: false
        default: "production"

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build + Deploy Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment == 'production' && 'Production' || 'Preview' }}
      url: ${{ steps.deploy.outputs.url }}

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_APP_NAME: ProntoClinic Hub
      VITE_APP_ENV: production
      VITE_TISS_AMBIENTE: HOMOLOGACAO
      VITE_TISS_VERSION: "4.03.00"
      VITE_DICOM_BUCKET: dicom
      VITE_ENABLE_TELEMEDICINE: "false"
      VITE_ENABLE_WHATSAPP: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Validate immutable main commit
        shell: bash
        run: |
          set -euo pipefail
          commit_sha='${{ inputs.commit_sha }}'
          [[ "$commit_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::commit_sha must contain exactly 40 lowercase hexadecimal characters"
            exit 1
          }
          test "$(git rev-parse 'HEAD^{commit}')" = "$commit_sha" || {
            echo "::error::Checked out commit does not match commit_sha"
            exit 1
          }
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$commit_sha" || {
            echo "::error::commit_sha must be exactly the current origin/main HEAD"
            exit 1
          }
          echo "commit_sha=$commit_sha" >> "$GITHUB_ENV"

      - name: Require successful CI for the same commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail-with-body --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$response_file" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${commit_sha}&branch=main&per_page=100"
          node - "$commit_sha" "$response_file" <<'NODE'
          const fs = require('node:fs');
          const expectedSha = process.argv[2];
          const payload = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const runs = (payload.workflow_runs || [])
            .filter((run) => run.head_sha === expectedSha && run.head_branch === 'main')
            .sort((left, right) =>
              Number(right.run_number) - Number(left.run_number) ||
              Number(right.run_attempt) - Number(left.run_attempt));
          const latest = runs[0];
          if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
            console.error(`::error::Latest CI for SHA is not green: ${latest?.html_url || 'not found'}`);
            process.exit(1);
          }
          console.log(`CI_GATE_PASS run_id=${latest.id} attempt=${latest.run_attempt} sha=${latest.head_sha}`);
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Show environment
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: $commit_sha"
          echo "Actor:  ${{ github.actor }}"
          echo "Supabase URL configured: $([ -n "$VITE_SUPABASE_URL" ] && echo yes || echo NO)"

      - name: Install dependencies
        run: npm ci

      - name: Generate PWA icons
        run: npm run icons

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build SPA
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html not found - build failed"
            exit 1
          fi
          echo "Build artifacts:"
          ls -lah dist/ | head -20

      - name: Install Vercel CLI
        run: npm install --no-save vercel@latest

      - name: Pull Vercel project info
        id: vercel-info
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "## Vercel Deploy" >> $GITHUB_STEP_SUMMARY
          echo "- Project: ${{ secrets.VERCEL_PROJECT_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- Org: ${{ secrets.VERCEL_ORG_ID }}" >> $GITHUB_STEP_SUMMARY

      - name: Deploy to Vercel (Production)
        id: deploy
        if: github.event_name == 'push' || github.event.inputs.environment == 'production'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod --yes"
          working-directory: ./
          github-comment: false

      - name: Deploy to Vercel (Preview)
        id: deploy-preview
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'preview'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--yes"
          working-directory: ./
          github-comment: false

      - name: Summary
        if: success() || failure()
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Actor:  ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.deploy.outputs.url }}" != "" ]; then
            echo "- URL:    ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- Time:   $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
