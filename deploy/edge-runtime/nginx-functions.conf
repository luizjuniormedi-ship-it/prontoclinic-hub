# Instalar dentro do server HTTPS do ProntoMedic após provisionar o runtime.
location = /functions/v1/dicom-bridge {
    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_pass http://127.0.0.1:9000/functions/v1/dicom-bridge;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location = /functions/v1/telemedicina-daily {
    client_max_body_size 256k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_pass http://127.0.0.1:9000/functions/v1/telemedicina-daily;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
