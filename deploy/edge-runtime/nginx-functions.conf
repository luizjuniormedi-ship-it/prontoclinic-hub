# Instalar dentro do server HTTPS do ProntoMedic após provisionar o runtime.
location = /functions/v1/auth-admin {
    client_max_body_size 256k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_pass http://127.0.0.1:9000/auth-admin;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location = /functions/v1/dicom-bridge {
    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_pass http://127.0.0.1:9000/dicom-bridge;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location = /functions/v1/telemedicina-daily {
    client_max_body_size 256k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_pass http://127.0.0.1:9000/telemedicina-daily;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# BEGIN PRONTOMEDIC MANAGED PRE-CADASTRO
location = /functions/v1/pre-cadastro {
    limit_req zone=pre_cadastro burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_pass http://127.0.0.1:9000/pre-cadastro;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
}
# END PRONTOMEDIC MANAGED PRE-CADASTRO
